<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>시스템 반영 중입니다</title>
    <link rel="stylesheet" href="/__system-update/page.css" />
    <!-- defer 가 아니다. 첫 페인트 전에 저장된 테마를 붙여야 한다. -->
    <script src="/__system-update/boot-theme.js"></script>
    <script src="/__system-update/page.js" defer></script>
  </head>
  <body>
    <main>
      <div class="progress" aria-hidden="true"></div>
      <h1>시스템 반영 중입니다</h1>
      <p>
        더 편리한 서비스를 위해 변경 사항을 반영하고 있습니다.<br />완료되면 보고 계시던 화면으로
        자동 이동합니다.
      </p>
      <p id="status" role="status" aria-live="polite">연결 상태를 확인하고 있습니다.</p>
      <button id="retry" type="button">지금 다시 확인</button>
      <p class="hint">이 창을 그대로 두셔도 됩니다.</p>
      <noscript
        ><p>자동 이동하려면 자바스크립트를 켜 주세요. 잠시 후 새로고침해도 됩니다.</p></noscript
      >
    </main>
  </body>
</html>
