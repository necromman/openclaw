worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Docker DNS를 요청 시 재조회해 게이트웨이 재생성 뒤 바뀐 주소를 따라간다.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map "$request_method:$http_sec_fetch_mode:$http_accept" $page_navigation {
        default 0;
        ~^GET:navigate: 1;
        ~^GET::.*text/html 1;
    }
    # 전달 헤더는 고정 주소의 터널만 신뢰한다. 브라우저가 보낸 XFF는 버린다.
    map $remote_addr $client_ip {
        default $remote_addr;
        172.16.240.10 $http_cf_connecting_ip;
    }
    map "$remote_addr:$http_x_forwarded_proto" $client_scheme {
        default http;
        "172.16.240.10:https" https;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        charset utf-8;
        recursive_error_pages on;
        allow 172.16.240.10;
        allow 127.0.0.1;
        deny all;
        set $gateway http://gateway:18789;

        # 기존 게이트웨이의 업로드 제한과 스트리밍 정책을 그대로 따른다.
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_redirect off;
        proxy_next_upstream off;

        location = /__system-update/live {
            return 204;
        }

        location = /__system-update/status {
            proxy_pass $gateway/readyz;
            proxy_read_timeout 5s;
            proxy_cache off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            error_page 502 504 = @unavailable;
        }

        location / {
            error_page 418 = @navigation;
            if ($page_navigation) { return 418; }
            # API의 정상적인 오류 본문은 그대로 전달한다.
            proxy_pass $gateway;
            error_page 502 504 = @unavailable;
        }

        location @navigation {
            proxy_pass $gateway;
            proxy_intercept_errors on;
            error_page 502 503 504 =503 /__system-update/page.html;
        }

        location = /__system-update/page.html {
            internal;
            alias /usr/share/nginx/html/index.html;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "5" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location = /__system-update/page.css {
            alias /usr/share/nginx/html/page.css;
            add_header Cache-Control "no-store" always;
        }

        location = /__system-update/page.js {
            alias /usr/share/nginx/html/page.js;
            add_header Cache-Control "no-store" always;
        }

        location @unavailable {
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header Retry-After "5" always;
            return 503 '{"error":{"code":"service_unavailable","message":"시스템 반영 중입니다. 잠시 후 다시 시도해 주세요."}}';
        }
    }
}
