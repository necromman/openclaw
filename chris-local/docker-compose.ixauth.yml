# Gateway + IX-Auth identity server + PostgreSQL.
#
# Usage:
#   cp chris-local/ixauth.env.example chris-local/ixauth.env   # then fill in the secrets
#   docker compose --env-file chris-local/ixauth.env -f chris-local/docker-compose.ixauth.yml up -d
#
# Install procedure and the .env table: chris-local/DEPLOY.md.
#
# Design invariant 4 (ix-auth/MODULE.md section 7): the identity server publishes no
# host port. Only the Gateway reaches it, over the private compose network. The browser
# talks to the Gateway's own /auth/* routes and receives one opaque session cookie. The
# identity server's admin console is reached only through the Gateway BFF route
# /admin/identity/, which admits superadmin and admin sessions and nobody else.
#
# Design invariant 3 is deliberately broken here, and the exception is recorded in
# ix-auth/MODULE.md section 7.1: OpenClaw stores its state in SQLite and IX-Auth
# supports only PostgreSQL, MariaDB, and MySQL, so there is no database to share.
# Swapping in a customer's MariaDB is a matter of changing IXAUTH_DB_URL and the
# credentials; the server carries migrations for all three dialects.

name: openclaw-ixauth

services:
  ix-auth-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${IXAUTH_DB_NAME:-ixauth}
      POSTGRES_USER: ${IXAUTH_DB_USERNAME:-ixauth}
      POSTGRES_PASSWORD: ${IXAUTH_DB_PASSWORD:?set IXAUTH_DB_PASSWORD}
    volumes:
      - ix-auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${IXAUTH_DB_USERNAME:-ixauth} -d ${IXAUTH_DB_NAME:-ixauth}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [ix-auth-internal]

  ix-auth:
    build:
      context: ../ix-auth
      dockerfile: docker/Dockerfile
    image: openclaw-ix-auth:local
    restart: unless-stopped
    depends_on:
      ix-auth-db:
        condition: service_healthy
    environment:
      IXAUTH_DB_URL: jdbc:postgresql://ix-auth-db:5432/${IXAUTH_DB_NAME:-ixauth}
      IXAUTH_DB_USERNAME: ${IXAUTH_DB_USERNAME:-ixauth}
      IXAUTH_DB_PASSWORD: ${IXAUTH_DB_PASSWORD:?set IXAUTH_DB_PASSWORD}
      # 32 characters or more; the server refuses to boot with a shorter key.
      IXAUTH_SERVICE_KEY: ${IXAUTH_SERVICE_KEY:?set IXAUTH_SERVICE_KEY}
      # Fixed, not operator-settable. The Gateway config file carries the same two
      # literals, and a mismatch makes every locally verified token fail on issuer or
      # audience. Pinning both sides here removes the single most common setup fault.
      IXAUTH_JWT_ISSUER: openclaw-ix-auth
      IXAUTH_JWT_AUDIENCE: openclaw-gateway
      # Seeded once on first boot and granted SUPERADMIN. Change the password after the
      # first sign-in; the console has a password-change screen.
      IXAUTH_ADMIN_EMAIL: ${IXAUTH_ADMIN_EMAIL:?set IXAUTH_ADMIN_EMAIL}
      IXAUTH_ADMIN_PASSWORD: ${IXAUTH_ADMIN_PASSWORD:?set IXAUTH_ADMIN_PASSWORD}
      IXAUTH_ADMIN_NAME: ${IXAUTH_ADMIN_NAME:-관리자}
      IXAUTH_ADMIN_UI_ENABLED: "true"
      # Self-service signup stays closed; administrators create accounts. The route is
      # service-key only, so a browser could not reach it anyway, but the default is
      # OPEN and a default that says "closed" is the one worth writing down.
      IXAUTH_ACCOUNT_SIGNUP_MODE: ${IXAUTH_ACCOUNT_SIGNUP_MODE:-CLOSED}
      IXAUTH_ACCOUNT_SIGNUP_VERIFICATION: ${IXAUTH_ACCOUNT_SIGNUP_VERIFICATION:-EMAIL}
      # Empty means any address may sign up. A comma separated list restricts it.
      IXAUTH_ACCOUNT_SIGNUP_ALLOWED_DOMAINS: ${IXAUTH_ACCOUNT_SIGNUP_ALLOWED_DOMAINS:-}
      # Three days. Long enough to survive a weekend, short enough that a forwarded
      # invitation does not stay usable for a week.
      IXAUTH_ACCOUNT_INVITE_TOKEN_TTL: ${IXAUTH_ACCOUNT_INVITE_TOKEN_TTL:-72h}
      # Where mail links point. These are Gateway screens, not identity server pages
      # (design invariant 4), so the base URL is the browser origin.
      IXAUTH_MAIL_APP_BASE_URL: ${OPENCLAW_PUBLIC_ORIGIN:-http://127.0.0.1:18800}
      IXAUTH_MAIL_FROM: ${IXAUTH_MAIL_FROM:-no-reply@localhost}
      IXAUTH_MAIL_PRODUCT_NAME: ${IXAUTH_MAIL_PRODUCT_NAME:-Chris Agent}
      # WEBHOOK is the default because this stack has no SMTP server. The identity
      # server hands each message to the Gateway instead, which keeps the invitation
      # link so an administrator can copy it out of the invitation screen. Set SMTP
      # once a mail server exists; then invitations are mailed and nothing is kept.
      IXAUTH_MAIL_TRANSPORT: ${IXAUTH_MAIL_TRANSPORT:-WEBHOOK}
      IXAUTH_MAIL_WEBHOOK_URL: ${IXAUTH_MAIL_WEBHOOK_URL:-http://gateway:18789/auth/mail-hook}
      IXAUTH_MAIL_SMTP_HOST: ${IXAUTH_MAIL_SMTP_HOST:-}
      IXAUTH_MAIL_SMTP_PORT: ${IXAUTH_MAIL_SMTP_PORT:-587}
      IXAUTH_MAIL_SMTP_USERNAME: ${IXAUTH_MAIL_SMTP_USERNAME:-}
      IXAUTH_MAIL_SMTP_PASSWORD: ${IXAUTH_MAIL_SMTP_PASSWORD:-}
      IXAUTH_MAIL_SMTP_STARTTLS: ${IXAUTH_MAIL_SMTP_STARTTLS:-true}
      # Password policy for seeded and console-created accounts.
      IXAUTH_PASSWORD_MIN_LENGTH: ${IXAUTH_PASSWORD_MIN_LENGTH:-10}
      IXAUTH_LOG_LEVEL: ${IXAUTH_LOG_LEVEL:-INFO}
      # Model provider credentials, empty by default: a deployment that answers from an
      # internal ollama service needs neither. The Gateway reads these names directly,
      # and the tracked config can also name them through a "${ANTHROPIC_API_KEY}"
      # SecretRef, so the value stays in the env file. Setup: DEPLOY.md 3.4.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TZ: ${OPENCLAW_TZ:-Asia/Seoul}
    # No ports section on purpose (design invariant 4). The console is reached through
    # the Gateway route /admin/identity/.
    networks: [ix-auth-internal]

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Chromium for the browser tool, CJK fonts so Korean text renders in screenshots
        # and PDF output instead of tofu boxes, and LibreOffice so Word, Excel, and
        # PowerPoint files get a real document preview rather than an image-less HTML
        # fallback. The converter adds roughly 580 MiB to the image; the measurement and
        # the font rules are in chris-local/FILE-PREVIEW.md.
        OPENCLAW_INSTALL_BROWSER: "1"
        OPENCLAW_IMAGE_APT_PACKAGES: "fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji fonts-nanum libreoffice-writer libreoffice-calc libreoffice-impress"
    image: openclaw-gateway:local
    restart: unless-stopped
    depends_on:
      ix-auth:
        condition: service_healthy
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_PORT: "18789"
      # Read by the committed config through its "${IXAUTH_SERVICE_KEY}" env SecretRef,
      # so the shared secret never has to be written into a tracked file.
      IXAUTH_SERVICE_KEY: ${IXAUTH_SERVICE_KEY:?set IXAUTH_SERVICE_KEY}
      # The exact origin the browser uses. It becomes gateway.controlUi.allowedOrigins.
      # Behind bridge networking the request no longer looks local to the Gateway, so
      # the loopback development shortcut does not apply and this must be right.
      OPENCLAW_PUBLIC_ORIGIN: ${OPENCLAW_PUBLIC_ORIGIN:-http://127.0.0.1:18800}
      # The same value the identity server gets. start-gateway.sh derives
      # gateway.auth.ixAuth.selfSignup from it, so the signup screen and the identity
      # server's signup mode can never disagree.
      IXAUTH_ACCOUNT_SIGNUP_MODE: ${IXAUTH_ACCOUNT_SIGNUP_MODE:-CLOSED}
      # Parent directory of the department shares on the host, empty by default. When
      # it is set, start-gateway.sh points the department agents' workspaces at the
      # read-only mounts below; when it is empty they keep their own writable state
      # directories and the mounts are only there to be looked at. One variable decides
      # both, so a bind mount can never disagree with the workspace it is meant to be.
      OPENCLAW_NAS_ROOT: ${OPENCLAW_NAS_ROOT:-}
      TZ: ${OPENCLAW_TZ:-Asia/Seoul}
    volumes:
      # Declarative config: the tracked template is copied over the state copy on every
      # start, so this file is the single source of truth for the deployment.
      - ./ixauth-gateway-config:/config:ro
      - gateway-state:/home/node/.openclaw
      # Department shares from the NAS, mounted read only. The agent workspace is the
      # whitelist: a folder reaches an agent by being mounted here and named in that
      # agent's "workspace", and by nothing else. Relative paths resolve against the
      # project directory, which is this file's directory, so the default is
      # chris-local/nas-sample: a tracked sample tree that lets the wiring be exercised
      # without a NAS. In a real delivery OPENCLAW_NAS_ROOT is an absolute host path
      # where the SMB or NFS shares are already mounted.
      #
      # Personnel and payroll (hr/) is deliberately absent from every mount, and that
      # absence is the control. A folder nobody mounts is a folder no agent can reach,
      # so adding a line for hr/ here is the single edit that would break the boundary.
      # There is no deny list to keep in step, which is the point: a blacklist would
      # have to enumerate every folder an agent must not see, and one forgotten entry
      # is an open door.
      - ${OPENCLAW_NAS_ROOT:-./nas-sample}/rnd:/mnt/nas/rnd:ro
      - ${OPENCLAW_NAS_ROOT:-./nas-sample}/qa:/mnt/nas/qa:ro
    ports:
      # The Gateway is the only service the browser ever reaches.
      - "${OPENCLAW_GATEWAY_PORT:-18800}:18789"
    # The script renders the tracked config into the state volume and then starts the
    # Gateway. The image binds loopback by default, which bridge networking cannot reach
    # through -p, so it binds "lan" instead. That is safe only because
    # gateway.auth.mode is "ix-auth": there is no unauthenticated surface behind it.
    command: ["sh", "/config/start-gateway.sh"]
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD", "node", "dist/docker-healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [ix-auth-internal]

  # Development inbox. Started only with --profile mail, and used to prove the SMTP
  # branch end to end: set IXAUTH_MAIL_TRANSPORT=SMTP and IXAUTH_MAIL_SMTP_HOST=mailpit
  # with port 1025, then read the message at http://127.0.0.1:18025.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: ${OPENCLAW_TZ:-Asia/Seoul}
    ports:
      - "${MAILPIT_UI_PORT:-18025}:8025"
    networks: [ix-auth-internal]

volumes:
  ix-auth-db-data:
  gateway-state:

networks:
  ix-auth-internal:
    driver: bridge
