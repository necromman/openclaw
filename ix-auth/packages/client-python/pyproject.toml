[project]
name = "ix-auth-client"
version = "0.1.0"
description = "IX-Auth 앱 측 Python 클라이언트 — JWKS 로컬 검증 + 권한 판정"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ix_auth_client"]
