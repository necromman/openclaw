<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brand mark">
  <!-- Fork brand mark. Neutral geometry only: a rounded plate, a ring and a "C"
       arc. No upstream artwork. Colors are literal so the file also works as a
       favicon, an apple-touch icon source and the assistant avatar. -->
  <defs>
    <linearGradient id="brand-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f4a5a" />
      <stop offset="100%" stop-color="#1b2029" />
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="5" ry="5" fill="url(#brand-plate)" />
  <circle cx="60" cy="60" r="40" fill="none" stroke="#5d6b7f" stroke-width="3" opacity="0.55" />
  <path
    d="M80 40 A28 28 0 1 0 80 80"
    fill="none"
    stroke="#e8edf4"
    stroke-width="11"
    stroke-linecap="round"
  />
  <circle cx="84" cy="60" r="7" fill="#8fb4d9" />
</svg>
